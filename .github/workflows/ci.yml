name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: 10.0.x
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ixtalaat/orderflow

jobs:
  build:
    name: Build + unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore OrderFlow.slnx

      - name: Build
        run: dotnet build OrderFlow.slnx --no-restore -c Release

      - name: Unit tests
        run: >
          dotnet test tests/OrderFlow.Tests/OrderFlow.Tests.csproj
          --no-build -c Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults

      - name: Report unit tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit tests
          path: TestResults/unit.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: "**/coverage.cobertura.xml"

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Integration tests
        run: >
          dotnet test tests/OrderFlow.IntegrationTests/OrderFlow.IntegrationTests.csproj
          -c Release
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults

      - name: Report integration tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration tests
          path: TestResults/integration.trx
          reporter: dotnet-trx
          fail-on-error: true

  sqlserver-tests:
    name: Integration tests (SQL Server)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      ORDERFLOW_TEST_DATABASE: SqlServer
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Integration tests on SQL Server
        run: >
          dotnet test tests/OrderFlow.IntegrationTests/OrderFlow.IntegrationTests.csproj
          -c Release

  frontend:
    name: Frontend build + unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npx ng build

      - name: Unit tests
        run: |
          npx playwright install --only-shell chromium
          CHROME_BIN=$(find ~/.cache/ms-playwright -name "headless_shell" -type f | head -1) \
            npx ng test --watch=false --browsers=ChromeHeadless

  e2e:
    name: Frontend e2e on compose stack
    runs-on: ubuntu-latest
    needs: [docker, frontend]
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Install browsers
        run: npx playwright install chromium

      - name: Start stack
        working-directory: .
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: Run e2e
        run: npx playwright test

      - name: Tear down
        if: always()
        working-directory: .
        run: docker compose down -v

  docker:
    name: Build + push images
    runs-on: ubuntu-latest
    needs: [build, integration-tests, sqlserver-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OrderFlow.API/Dockerfile
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api:latest

      - name: Build and push accounting image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OrderFlow.FakeAccountingApi/Dockerfile
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-accounting:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-accounting:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest

  deploy-smoke:
    name: Compose deploy smoke test
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Create ephemeral .env
        run: |
          cat > .env <<EOF
          SA_PASSWORD=SmokeTest123!
          JWT_SECRET_KEY=ci-smoke-test-secret-key-at-least-32-chars
          ADMIN_EMAIL=admin@orderflow.com
          ADMIN_PASSWORD=SmokeAdmin123!
          ADMIN_FULLNAME=OrderFlow Admin
          EOF

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready | grep -q '"database"'; then
              echo "ready"; exit 0
            fi
            sleep 10
          done
          echo "API never became ready"; docker compose logs api; exit 1

      - name: Admin login smoke
        run: |
          curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@orderflow.com","password":"SmokeAdmin123!"}' | grep -q accessToken

      - name: Tear down
        if: always()
        run: docker compose down -v
