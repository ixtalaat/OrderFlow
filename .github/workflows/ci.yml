name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  DOTNET_VERSION: 10.0.x
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ixtalaat/orderflow

jobs:
  build:
    name: Build + unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore OrderFlow.slnx

      - name: Build
        run: dotnet build OrderFlow.slnx --no-restore -c Release

      - name: Unit tests
        run: >
          dotnet test tests/OrderFlow.Tests/OrderFlow.Tests.csproj
          --no-build -c Release
          --collect:"XPlat Code Coverage"
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults

      - name: Report unit tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Unit tests
          path: TestResults/unit.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: "**/coverage.cobertura.xml"

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Integration tests
        run: >
          dotnet test tests/OrderFlow.IntegrationTests/OrderFlow.IntegrationTests.csproj
          -c Release
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults

      - name: Report integration tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Integration tests
          path: TestResults/integration.trx
          reporter: dotnet-trx
          fail-on-error: true

  sqlserver-tests:
    name: Integration tests (SQL Server)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: SqlServer2022!
        ports:
          - 1433:1433
        options: >-
          --health-cmd /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P SqlServer2022! -C -Q "SELECT 1" -b -o /dev/null
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    env:
      ORDERFLOW_TEST_DATABASE: SqlServer
      ORDERFLOW_TEST_SQLSERVER: Server=localhost,1433;Database=OrderFlowTests;User Id=sa;Password=SqlServer2022!;TrustServerCertificate=true
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Integration tests on SQL Server
        run: >
          dotnet test tests/OrderFlow.IntegrationTests/OrderFlow.IntegrationTests.csproj
          -c Release

  docker:
    name: Build + push images
    runs-on: ubuntu-latest
    needs: [build, integration-tests, sqlserver-tests]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OrderFlow.API/Dockerfile
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-api:latest

      - name: Build and push accounting image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/OrderFlow.FakeAccountingApi/Dockerfile
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-accounting:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-accounting:latest

  deploy-smoke:
    name: Compose deploy smoke test
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Create ephemeral .env
        run: |
          cat > .env <<EOF
          SA_PASSWORD=SmokeTest123!
          JWT_SECRET_KEY=ci-smoke-test-secret-key-at-least-32-chars
          ADMIN_EMAIL=admin@orderflow.com
          ADMIN_PASSWORD=SmokeAdmin123!
          ADMIN_FULLNAME=OrderFlow Admin
          EOF

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health/ready | grep -q '"database"'; then
              echo "ready"; exit 0
            fi
            sleep 10
          done
          echo "API never became ready"; docker compose logs api; exit 1

      - name: Admin login smoke
        run: |
          curl -fsS -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@orderflow.com","password":"SmokeAdmin123!"}' | grep -q accessToken

      - name: Tear down
        if: always()
        run: docker compose down -v
