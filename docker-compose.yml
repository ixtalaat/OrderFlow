services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  accounting:
    build:
      context: .
      dockerfile: src/OrderFlow.FakeAccountingApi/Dockerfile

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4200:80"
    environment:
      API_URL: http://localhost:8080
    depends_on:
      - api

  mailpit:
    image: axllent/mailpit:latest
    # --smtp-auth-allow-insecure is dev/test only: authentication without TLS.
    command: ["--smtp-auth-allow-insecure"]
    ports:
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.128.0
    command: ["--config=/etc/otelcol-config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otelcol-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v3.3.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api
      - otel-collector

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-orderflow}
    depends_on:
      - prometheus

  api:
    build:
      context: .
      dockerfile: src/OrderFlow.API/Dockerfile
    # Self-heals a startup race where SQL Server accepts connections before
    # existing databases finish recovery (migration sees a missing DB once).
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=OrderFlowDb;User Id=sa;Password=${SA_PASSWORD:?Set SA_PASSWORD in .env};TrustServerCertificate=true
      Accounting__BaseUrl: http://accounting:5099/
      Telemetry__OtlpEndpoint: http://otel-collector:4317
      Email__Enabled: true
      Email__Host: mailpit
      Email__Port: 1025
      Email__From: no-reply@orderflow.local
      Email__UserName: mailpit
      Email__Password: mailpit
      Cors__AllowedOrigins__0: http://localhost:4200
      Jwt__SecretKey: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      AdminSeed__Email: ${ADMIN_EMAIL:-admin@orderflow.com}
      AdminSeed__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      AdminSeed__FullName: ${ADMIN_FULLNAME:-OrderFlow Admin}
    depends_on:
      sqlserver:
        condition: service_healthy
      accounting:
        condition: service_started

volumes:
  mssql-data:
