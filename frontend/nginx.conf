server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Angular SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Entry point and icons: always revalidate so deploys show immediately.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /app-icon.svg {
    add_header Cache-Control "no-cache";
  }

  location = /app-icon.ico {
    add_header Cache-Control "no-cache";
  }

  location = /favicon.ico {
    add_header Cache-Control "no-cache";
  }

  # Hashed Angular bundles (outputHashing: all) are immutable.
  location ~* "\.[A-Za-z0-9]{8,}\.(js|css)$" {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
