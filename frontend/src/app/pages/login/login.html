<div class="auth-split">
  <app-auth-aside />
  <div class="auth-main">
    <p-card [header]="lang.t('auth.loginTitle')" class="auth-card">
      <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
        @if (failure()) {
          <p-message severity="error" [text]="failure()!" />
        }
        <label for="email">{{ lang.t('auth.email') }}</label>
        <input pInputText id="email" type="email" formControlName="email" autocomplete="email" />
        <label for="password">{{ lang.t('auth.password') }}</label>
        <p-password id="password" formControlName="password" [feedback]="false" [toggleMask]="true" />
        <p-button type="submit" [label]="lang.t('auth.loginBtn')" [loading]="busy()" [disabled]="form.invalid" />
        <p>{{ lang.t('auth.newHere') }} <a routerLink="/register">{{ lang.t('auth.createAccount') }}</a></p>
      </form>
    </p-card>
  </div>
</div>
