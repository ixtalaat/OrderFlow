<p-card header="Log in" class="auth-card">
  <ng-template #header>
    <i class="pi pi-sign-in auth-icon" aria-hidden="true"></i>
  </ng-template>
  <form [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
    @if (failure()) {
      <p-message severity="error" [text]="failure()!" />
    }
    <label for="email">Email</label>
    <input pInputText id="email" type="email" formControlName="email" autocomplete="email" />
    <label for="password">Password</label>
    <p-password id="password" formControlName="password" [feedback]="false" [toggleMask]="true" />
    <p-button type="submit" label="Log in" [loading]="busy()" [disabled]="form.invalid" />
    <p>New here? <a routerLink="/register">Create an account</a></p>
  </form>
</p-card>
