<h1>Pricing rules</h1>
<p>Tiers: 0 Regular · 1 Wholesale · 2 VIP. Rules apply per product; overlapping rules are rejected.</p>
<p-button label="New rule" (onClick)="openCreate()" />
@if (failure()) {
  <p-message severity="error" [text]="failure()!" />
}
@if (success()) {
  <p-message severity="success" [text]="success()!" />
}
<p-dialog header="Pricing rule" [(visible)]="dialogOpen" [modal]="true" [dismissableMask]="true" [style]="{ width: '28rem' }" [breakpoints]="{ '640px': '95vw' }">
  <div class="dialog-form">
    <label for="productId">Product ID</label>
    <p-inputNumber id="productId" [(ngModel)]="form.productId" ariaLabel="Product ID" />
    <label for="tier">Tier (0/1/2)</label>
    <p-inputNumber id="tier" [(ngModel)]="form.tier" [min]="0" [max]="2" ariaLabel="Tier" />
    <label for="discount">Discount %</label>
    <p-inputNumber id="discount" [(ngModel)]="form.discountPercentage" ariaLabel="Discount percentage" />
    <p-button label="Save" (onClick)="save()" />
  </div>
</p-dialog>
