<h1>Coupons</h1>
<p-button label="New coupon" (onClick)="openCreate()" />
@if (failure()) {
  <p-message severity="error" [text]="failure()!" />
}
@if (success()) {
  <p-message severity="success" [text]="success()!" />
}
<p-dialog header="Coupon" [(visible)]="dialogOpen" [modal]="true" [dismissableMask]="true" [style]="{ width: '28rem' }" [breakpoints]="{ '640px': '95vw' }">
  <div class="dialog-form">
    <label for="code">Code</label>
    <input pInputText id="code" [(ngModel)]="form.code" />
    <label for="discount">Discount %</label>
    <p-inputNumber id="discount" [(ngModel)]="form.discountPercentage" ariaLabel="Discount percentage" />
    <label for="minTotal">Minimum order total</label>
    <p-inputNumber id="minTotal" [(ngModel)]="form.minOrderTotal" ariaLabel="Minimum order total" />
    <p-button label="Save" (onClick)="save()" />
  </div>
</p-dialog>
